name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Manifest and archive
        run: |
          node trade-ui/scripts/verify.mjs manifest trade-ui/build | cmp - trade-ui/build/manifest.json
          cp trade-ui/build/manifest.json manifest.json
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C trade-ui -cf - build | gzip -n > build.tar.gz
          jq -r .version manifest.json
      - name: Attest
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            manifest.json
            build.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" manifest.json build.tar.gz --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Serves as \`$(jq -r .version manifest.json)\`. To check the live site against it, see the README."
      - name: Compare with the live site
        run: node trade-ui/scripts/verify.mjs https://get.hyperliqui.date trade-ui/build
